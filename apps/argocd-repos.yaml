apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-repos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/evansabove/homelab-gitops.git
    targetRevision: main
    path: infrastructure/argocd-repos
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
