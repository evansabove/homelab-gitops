apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-issuers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/evansabove/homelab-gitops.git
    targetRevision: main
    path: infrastructure/cert-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ClusterIssuer CRD only exists once cert-manager is installed —
    # retry until it appears.
    retry:
      limit: -1
      backoff:
        duration: 30s
        maxDuration: 5m
