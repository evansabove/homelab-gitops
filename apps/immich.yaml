apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # The Immich Helm chart (OCI registry, registered via infrastructure/argocd-repos),
    # configured from values in this repo
    - repoURL: ghcr.io/immich-app/immich-charts
      chart: immich
      targetRevision: 0.13.1
      helm:
        valueFiles:
          - $values/workloads/immich/values.yaml
    - repoURL: https://github.com/evansabove/homelab-gitops.git
      targetRevision: main
      ref: values
    # Supporting resources the chart doesn't provide: postgres + library PVC
    - repoURL: https://github.com/evansabove/homelab-gitops.git
      targetRevision: main
      path: workloads/immich/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
