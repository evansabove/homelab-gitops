# Example app + smoke test for the GitOps pipeline: a tiny HTTP echo server.
# Delete this file (and workloads/whoami/) once you have real apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/evansabove/homelab-gitops.git
    targetRevision: main
    path: workloads/whoami
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
