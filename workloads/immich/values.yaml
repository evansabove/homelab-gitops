# Values for the immich Helm chart (chart pinned in apps/immich.yaml).

# Server + ML image tag. The chart's default follows its appVersion, which can
# lag behind Immich releases — pin the exact version here instead.
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.0.3

# In-cluster Valkey (Redis-compatible), bundled by the chart
valkey:
  enabled: true

immich:
  persistence:
    library:
      # PVC defined in workloads/immich/manifests/pvc.yaml
      existingClaim: immich-library

server:
  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME: immich-postgres
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  # SealedSecret in manifests/postgres-secret.yaml
                  name: immich-postgres
                  key: password
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - host: immich.andyevans.dev
          paths:
            - path: /
      tls:
        - secretName: immich-tls
          hosts:
            - immich.andyevans.dev

machine-learning:
  persistence:
    cache:
      # Persist the ML model cache so models aren't re-downloaded on restart
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteOnce
