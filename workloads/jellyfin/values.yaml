# Values for the jellyfin Helm chart (chart pinned in apps/jellyfin.yaml).
#
# Adopted verbatim from the hand-installed Helm release (jellyfin-3.2.0), minus
# a stray Traefik Middleware manifest that had been pasted into the values file
# as top-level apiVersion/kind/metadata/spec keys — the chart ignored those, so
# the Middleware was really created out-of-band. It now lives in
# manifests/middleware.yaml.

replicaCount: 1

image:
  pullPolicy: IfNotPresent

persistence:
  config:
    enabled: true
    size: 5Gi
    # Empty = cluster default (local-path). Matches the live PVCs, which the
    # chart renders without a storageClassName.
    storageClass: ""
  media:
    enabled: true
    size: 100Gi
    storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    # One iGPU. Extended resources must have limit == request; Kubernetes
    # mirrors this into requests automatically.
    gpu.intel.com/i915: 1
    # Raised from 2 cores now that Ollama — which reserved 5 of benson's 6 —
    # is gone. Still leaves a core for k3s, Immich and the Tailscale proxies.
    # A limit is a ceiling, not a reservation: idle Jellyfin still uses ~0.
    # Software transcoding for remote playback is what needs the headroom.
    cpu: "5"
    memory: 4Gi

# Hardware transcoding via Intel Quick Sync (UHD 630 on benson's i5-8500T).
#
# The iGPU is requested as an extended resource rather than mounted by hand.
# A hostPath mount of /dev/dri makes the device visible but not usable:
# Kubernetes gates device use through the device cgroup, so opening an
# un-allocated node fails with EPERM even as root. The Intel GPU device plugin
# (apps/intel-gpu-plugin.yaml) advertises gpu.intel.com/i915 and the kubelet
# grants real access on allocation — no privileged container needed.
#
# supplementalGroups is belt-and-braces: the container currently runs as root,
# which can open the device once allocated, but these keep it working if the
# image ever drops to a non-root user. 992 owns renderD128, 44 owns card0 on
# this host.
podSecurityContext:
  supplementalGroups:
    - 992  # render
    - 44   # video

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Middleware defined in manifests/middleware.yaml (default namespace)
    traefik.ingress.kubernetes.io/router.middlewares: default-jellyfin-buffering@kubernetescrd
  hosts:
    - host: benson.andyevans.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    # Issued by the Certificate in manifests/certificate.yaml
    - secretName: benson-tls
      hosts:
        - benson.andyevans.dev
