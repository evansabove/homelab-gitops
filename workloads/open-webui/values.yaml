# Values for the open-webui Helm chart (chart pinned in apps/open-webui.yaml).

# Ollama runs as its own app (apps/ollama.yaml) — don't bundle the subchart
ollama:
  enabled: false

ollamaUrls:
  - http://ollama.ollama.svc.cluster.local:11434

extraEnvVars:
  # The alias created in workloads/ollama/values.yaml. Read on first start
  # only; afterwards it's stored in Open WebUI's DB and set in the admin UI.
  - name: DEFAULT_MODELS
    value: mellum
  # Background tasks (chat titles, tags, follow-up suggestions) run on the chat
  # model and queue behind it in Ollama's single slot. With a thinking model on
  # CPU each costs as much as a real reply, so the next question waits minutes.
  # Same caveat as above: first start only, after that it's Admin Panel →
  # Settings → Interface.
  - name: ENABLE_TITLE_GENERATION
    value: "False"
  - name: ENABLE_TAGS_GENERATION
    value: "False"
  - name: ENABLE_FOLLOW_UP_GENERATION
    value: "False"

pipelines:
  enabled: false

# Single replica: in-memory websocket manager, no bundled Redis
websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

# Chat history, users, uploaded documents (local-path)
persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi

ingress:
  enabled: true
  class: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  host: chat.andyevans.dev
  tls: true
  existingSecret: open-webui-tls
