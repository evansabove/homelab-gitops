# Helm values for the argo-cd chart.
# To upgrade or reconfigure ArgoCD itself, edit this file (or bump
# argocd_chart_version) and re-run the bootstrap playbook.
global:
  domain: argocd.andyevans.dev

configs:
  params:
    # TLS terminates at the Traefik ingress; argocd-server itself speaks HTTP.
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls: true

# Trim resource usage for a homelab — drop this block if you have headroom.
controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

dex:
  # SSO connector — not needed for local admin login.
  enabled: false

notifications:
  enabled: false
